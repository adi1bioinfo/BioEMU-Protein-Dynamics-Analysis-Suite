[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioemu-analysis-suite"
version = "1.0.0"
description = "Comprehensive analysis suite for BioEMU and molecular dynamics trajectories"
readme = "README.md"
authors = [
  { name = "Aditi Laddha", email = "laddhadi@iitk.ac.in" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Biology",
]
requires-python = ">=3.8"
dependencies = [
    # "bioemu>=1.0.0",  # Optional: For MD relaxation capabilities
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "MDAnalysis>=2.0.0",
    "mdtraj>=1.9.0",
    "prody>=2.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "py3Dmol>=1.8.0",
    "jupyter>=1.0.0",
    "ipython>=7.0.0",
    "ipywidgets>=7.6.0",
    "tqdm>=4.62.0",
    "pillow>=8.0.0",
    "gsd<4.0.0", # Pin gsd to support numpy 1.x in CI
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov",
    "black>=21.0",
    "pylint>=2.8.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
md = [
    "bioemu[md]>=1.0.0"
]

[project.urls]
"Homepage" = "https://github.com/adi1bioinfo/BioEMU-Protein-Dynamics-Analysis-Suite"
"Bug Tracker" = "https://github.com/adi1bioinfo/BioEMU-Protein-Dynamics-Analysis-Suite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
