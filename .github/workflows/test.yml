name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install build dependencies manually to support --no-build-isolation
        # pinned numpy<2.0.0 is CRITICAL for MDTraj/Cython compilation
        # Force specific stable numpy 1.x version to avoid any 2.0.0rc1 leakage
        python -m pip install versioneer Cython "numpy==1.26.4" oldest-supported-numpy
        # Install package without build isolation to force use of pre-installed numpy
        pip install --no-build-isolation -e .[dev]
        
    - name: Run tests
      run: |
        pytest
